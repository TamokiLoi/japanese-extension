<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Explicit light-only signal, declared as early as possible (before
         any CSS/JS) so nothing downstream -- browser auto-dark heuristics
         included -- has a window to guess otherwise. style.css's own
         `color-scheme: light` on :root is a redundant second signal for
         everything that arrives after this. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon48.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180x180.png" />
    <title>Nihongo Nin</title>
    <link rel="stylesheet" href="/src/popup/style.css" />
    <style>
      html {
        color-scheme: light;
      }
      /* Shown immediately from the static HTML, before any JS parses or the
         web build's dynamically-imported WebApp chunk arrives -- replaces
         what used to be a blank white flash with the app's own logo. Plain
         CSS only (no Tailwind/React dependency) so it can render before
         either is available; removed by the inline script below once #app
         actually has content. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        transition: opacity 0.15s ease-out;
      }
      #splash[data-hide] {
        opacity: 0;
        pointer-events: none;
      }
      /* Named "spinner-ring", not "ring" -- the web build also loads
         Tailwind's CSS (src/web/**), which ships its own utility class
         literally named .ring (the focus-ring box-shadow utility). A
         same-named class here collided with it: once that stylesheet
         chunk finished loading -- timing-wise, right as #app mounts and
         this splash is about to fade out -- Tailwind's box-shadow (black
         by default, no ring color set) started applying to this div,
         showing as a black SQUARE frame around the round spinner+logo for
         the last instant before hide() ran. Confirmed via computed
         styles: the box-shadow traced back to Tailwind's plain `.ring`
         rule, not any local CSS or the image itself. */
      #splash .spinner-ring {
        position: relative;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash .spinner-ring::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #f3dede;
        border-top-color: #e11d48;
        animation: splash-spin 0.8s linear infinite;
      }
      /* icon128.png is a fully opaque square (no transparent corners) --
         border-radius applied directly to the <img> only clips reliably
         once the browser has laid out AND decoded the image, and on some
         mobile browsers the image's first paint (right when it finishes
         loading, which given the network fetch is usually near the end
         of the splash's visible time) shows the full square before that
         catches up -- seen as a black square (the icon's dark background)
         framing the red logo mark. Doing the clip on a wrapper via
         overflow:hidden is layout-based, not tied to the image's own
         decode/paint timing, so it clips from the very first frame. */
      #splash .logo-clip {
        display: block;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        overflow: hidden;
      }
      #splash .logo-clip img {
        display: block;
        width: 100%;
        height: 100%;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .spinner-ring::before {
          animation: none;
        }
      }
    </style>
    <script>
      // A service worker can keep an older app shell after a Pages deploy,
      // while the deploy has already removed that shell's lazy-loaded chunks.
      // Vite emits this event when one of those dynamic imports fails. Recover
      // only on that hard failure (never during a healthy study session): ask
      // the waiting worker to activate and reload once. Learning data lives in
      // localStorage/IndexedDB and is intentionally left untouched.
      (function () {
        var recoveryKey = "nihongo-chunk-recovery-attempt";
        var recovering = false;

        function showRecoveryMessage() {
          var panel = document.createElement("main");
          panel.setAttribute("role", "alert");
          panel.style.cssText =
            "position:fixed;inset:0;z-index:10000;display:grid;place-content:center;gap:12px;padding:24px;background:#fafafa;color:#262626;text-align:center;font:16px/1.5 system-ui,sans-serif";
          panel.innerHTML =
            '<strong style="font-size:22px">Không tải được phiên bản mới</strong>' +
            '<span>Ứng dụng sẽ giữ nguyên dữ liệu học. Hãy thử tải lại để đồng bộ bản cập nhật.</span>' +
            '<button type="button" style="justify-self:center;border:0;border-radius:10px;background:#e11d48;color:white;padding:11px 20px;font:600 15px system-ui,sans-serif;cursor:pointer">Tải lại</button>';
          panel.querySelector("button").addEventListener("click", function () {
            try {
              sessionStorage.removeItem(recoveryKey);
            } catch (_) {}
            window.location.reload();
          });
          document.body.appendChild(panel);
        }

        function waitForWorker(registration) {
          return new Promise(function (resolve) {
            var settled = false;
            var timeout = window.setTimeout(function () {
              finish(null);
            }, 15000);

            function finish(worker) {
              if (settled) return;
              settled = true;
              window.clearTimeout(timeout);
              registration.removeEventListener("updatefound", onUpdateFound);
              resolve(worker);
            }

            function onUpdateFound() {
              var worker = registration.installing;
              if (!worker) return;
              if (worker.state === "installed") {
                finish(registration.waiting || worker);
                return;
              }
              worker.addEventListener("statechange", function () {
                if (worker.state === "installed" || worker.state === "activated") {
                  finish(registration.waiting || worker);
                }
              });
            }

            registration.addEventListener("updatefound", onUpdateFound);
            if (registration.waiting) finish(registration.waiting);
          });
        }

        async function recover() {
          if (recovering) return;
          recovering = true;

          var previousAttempt = false;
          try {
            previousAttempt = sessionStorage.getItem(recoveryKey) === "1";
            if (!previousAttempt) sessionStorage.setItem(recoveryKey, "1");
          } catch (_) {}

          if (previousAttempt) {
            showRecoveryMessage();
            return;
          }

          var controller = navigator.serviceWorker && navigator.serviceWorker.controller;
          var controllerChanged = new Promise(function (resolve) {
            if (!navigator.serviceWorker || !controller) {
              resolve(false);
              return;
            }
            var timeout = window.setTimeout(function () {
              navigator.serviceWorker.removeEventListener("controllerchange", onChange);
              resolve(false);
            }, 15000);
            function onChange() {
              if (navigator.serviceWorker.controller === controller) return;
              window.clearTimeout(timeout);
              navigator.serviceWorker.removeEventListener("controllerchange", onChange);
              resolve(true);
            }
            navigator.serviceWorker.addEventListener("controllerchange", onChange);
          });

          try {
            if (navigator.serviceWorker) {
              var registration = await navigator.serviceWorker.getRegistration();
              if (registration) {
                var workerPromise = waitForWorker(registration);
                await registration.update().catch(function () {});
                var worker = registration.waiting || (await workerPromise);
                if (worker) {
                  worker.postMessage({ type: "SKIP_WAITING" });
                  worker.addEventListener("statechange", function () {
                    if (worker.state === "activated") window.location.reload();
                  });
                  if ((await controllerChanged) || worker.state === "activated") {
                    window.location.reload();
                    return;
                  }
                }
              }
            }
          } catch (_) {
            // Fall through to a visible retry message if update checks fail.
          }

          showRecoveryMessage();
        }

        window.addEventListener("vite:preloadError", function (event) {
          event.preventDefault();
          void recover();
        });
      })();

      // Undoes public/404.html's redirect trick: GitHub Pages has no
      // server-side SPA rewrite, so a direct link/reload on a non-root path
      // (e.g. /japanese-extension/bunpo) 404s there first, and 404.html
      // bounces it here as e.g. /japanese-extension/?/bunpo/kanji-%E7%94%B7.
      // Turn that back into a real path via replaceState before WebApp.tsx's
      // router reads location.pathname on mount. No-op for the extension
      // build (chrome-extension:// loads never carry this "?/" marker) and
      // for a plain root load (no search string to restore).
      (function () {
        var l = window.location;
        if (l.search[1] !== "/") return;
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
      })();
    </script>
  </head>
  <body>
    <div id="splash">
      <div class="spinner-ring">
        <span class="logo-clip"><img src="%BASE_URL%icons/icon128.png" alt="" /></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/popup/main.tsx"></script>
    <script>
      // Hides the splash once React has actually mounted something into
      // #app, instead of on a fixed timer -- works the same whether that
      // takes a few ms (extension popup, everything bundled locally) or
      // noticeably longer (web build's dynamically-imported WebApp chunk).
      (function () {
        var splash = document.getElementById("splash");
        var appEl = document.getElementById("app");
        if (!splash || !appEl) return;
        function hide() {
          splash.setAttribute("data-hide", "");
          setTimeout(function () {
            splash.remove();
          }, 200);
          // If the app stays healthy after a recovery reload, allow a future
          // independent chunk failure to use the same one-time recovery.
          setTimeout(function () {
            try {
              sessionStorage.removeItem("nihongo-chunk-recovery-attempt");
            } catch (_) {}
          }, 30000);
        }
        if (appEl.childNodes.length > 0) {
          hide();
          return;
        }
        var observer = new MutationObserver(function () {
          if (appEl.childNodes.length > 0) {
            observer.disconnect();
            hide();
          }
        });
        observer.observe(appEl, { childList: true });
      })();
    </script>
  </body>
</html>
