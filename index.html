<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icons/icon48.png" />
    <title>Nihongo Nin</title>
    <link rel="stylesheet" href="/src/popup/style.css" />
    <style>
      /* Shown immediately from the static HTML, before any JS parses or the
         web build's dynamically-imported WebApp chunk arrives -- replaces
         what used to be a blank white flash with the app's own logo. Plain
         CSS only (no Tailwind/React dependency) so it can render before
         either is available; removed by the inline script below once #app
         actually has content. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        transition: opacity 0.15s ease-out;
      }
      #splash[data-hide] {
        opacity: 0;
        pointer-events: none;
      }
      #splash .ring {
        position: relative;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash .ring::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #f3dede;
        border-top-color: #e11d48;
        animation: splash-spin 0.8s linear infinite;
        /* Chromium/Android WebView bug: a border-radius element that's
           animated (or sits under an ancestor whose opacity is animated,
           as happens here right as #splash fades out via [data-hide])
           can rasterize as a solid black frame during GPU layer
           promotion instead of clipping to the rounded shape. Forcing
           the mask-image paint path instead of border-radius clipping
           avoids it -- white/black keywords are both fully opaque, so
           this mask is a visual no-op, purely a rendering-path switch. */
        -webkit-mask-image: -webkit-radial-gradient(white, black);
      }
      #splash img {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        -webkit-mask-image: -webkit-radial-gradient(white, black);
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring::before {
          animation: none;
        }
      }
    </style>
    <script>
      // Undoes public/404.html's redirect trick: GitHub Pages has no
      // server-side SPA rewrite, so a direct link/reload on a non-root path
      // (e.g. /japanese-extension/bunpo) 404s there first, and 404.html
      // bounces it here as e.g. /japanese-extension/?/bunpo/kanji-%E7%94%B7.
      // Turn that back into a real path via replaceState before WebApp.tsx's
      // router reads location.pathname on mount. No-op for the extension
      // build (chrome-extension:// loads never carry this "?/" marker) and
      // for a plain root load (no search string to restore).
      (function () {
        var l = window.location;
        if (l.search[1] !== "/") return;
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
      })();
    </script>
  </head>
  <body>
    <div id="splash">
      <div class="ring">
        <img src="/icons/icon128.png" alt="" />
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/popup/main.tsx"></script>
    <script>
      // Hides the splash once React has actually mounted something into
      // #app, instead of on a fixed timer -- works the same whether that
      // takes a few ms (extension popup, everything bundled locally) or
      // noticeably longer (web build's dynamically-imported WebApp chunk).
      (function () {
        var splash = document.getElementById("splash");
        var appEl = document.getElementById("app");
        if (!splash || !appEl) return;
        function hide() {
          splash.setAttribute("data-hide", "");
          setTimeout(function () {
            splash.remove();
          }, 200);
        }
        if (appEl.childNodes.length > 0) {
          hide();
          return;
        }
        var observer = new MutationObserver(function () {
          if (appEl.childNodes.length > 0) {
            observer.disconnect();
            hide();
          }
        });
        observer.observe(appEl, { childList: true });
      })();
    </script>
  </body>
</html>
